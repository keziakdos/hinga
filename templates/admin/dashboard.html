{% extends "layout.html" %}
{% block content %}
<div class="max-w-4xl mx-auto text-center">
    <h1 class="text-3xl font-bold text-red-900 mb-8">🔧 Administration</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <a href="{{ url_for('admin_users') }}" class="glass p-8 rounded-2xl hover:bg-white/40 transition group">
            <i class="ph ph-users text-5xl text-blue-600 mb-4 group-hover:scale-110 transition"></i>
            <h2 class="text-xl font-bold text-gray-800">Utilisateurs</h2>
            <p class="text-sm text-gray-600">Créer et supprimer des comptes</p>
        </a>

        <a href="{{ url_for('admin_plants') }}" class="glass p-8 rounded-2xl hover:bg-white/40 transition group">
            <i class="ph ph-plant text-5xl text-green-600 mb-4 group-hover:scale-110 transition"></i>
            <h2 class="text-xl font-bold text-gray-800">Plantes</h2>
            <p class="text-sm text-gray-600">Ajouter ou modifier les fiches plantes</p>
        </a>

        <a href="{{ url_for('admin_tips') }}" class="glass p-8 rounded-2xl hover:bg-white/40 transition group">
            <i class="ph ph-lightbulb text-5xl text-yellow-500 mb-4 group-hover:scale-110 transition"></i>
            <h2 class="text-xl font-bold text-gray-800">Conseils</h2>
            <p class="text-sm text-gray-600">Gérer les astuces jardinage</p>
        </a>
    </div>
</div>
{% endblock %}
