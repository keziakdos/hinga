{% extends "layout.html" %}
{% block content %}
<div class="max-w-xl mx-auto pb-10">
    <div class="glass p-8 rounded-3xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-green-900">Modifier l'annonce</h1>
            <a href="{{ url_for('admin.admin_announcements') }}" class="text-gray-600 underline text-sm">Annuler</a>
        </div>
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="title" value="{{ item.title }}" required class="w-full p-2 rounded bg-white/50 border border-white/30">
            <textarea name="body" rows="4" class="w-full p-2 rounded bg-white/50 border border-white/30">{{ item.body }}</textarea>
            <button class="w-full bg-green-700 text-white py-3 rounded-xl font-bold">Enregistrer</button>
        </form>
    </div>
</div>
{% endblock %}
