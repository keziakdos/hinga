{% extends "layout.html" %}
{% block content %}
<div class="flex justify-center items-center h-[70vh]">
    <div class="glass p-8 rounded-3xl w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-green-900 mb-6">Connexion Hinga</h1>
        
        <form method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Identifiant" required class="w-full p-3 rounded-xl bg-white/50 border border-white/30 focus:outline-none focus:ring-2 focus:ring-green-500">
            <input type="password" name="password" placeholder="Mot de passe" required class="w-full p-3 rounded-xl bg-white/50 border border-white/30 focus:outline-none focus:ring-2 focus:ring-green-500">
            
            <button type="submit" class="w-full py-3 bg-green-700 hover:bg-green-800 text-white font-bold rounded-xl transition shadow-lg">
                Se connecter
            </button>
        </form>
    </div>
</div>
{% endblock %}
