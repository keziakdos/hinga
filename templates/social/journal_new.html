{% extends "layout.html" %}
{% block content %}
<div class="max-w-xl mx-auto pb-10">
    <div class="glass p-8 rounded-3xl">
        <h1 class="text-2xl font-bold text-green-900 mb-6">Nouveau billet</h1>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <textarea name="text" rows="4" required maxlength="1000" placeholder="Mes tomates ce matin…" class="w-full p-2 rounded bg-white/50 border border-white/30"></textarea>
            <div>
                <label class="font-bold text-gray-700 text-sm">Photo (optionnelle)</label>
                <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif" class="w-full p-2 bg-white/50 rounded">
            </div>
            <button class="w-full bg-green-700 text-white py-3 rounded-xl font-bold">Publier</button>
        </form>
    </div>
</div>
{% endblock %}
