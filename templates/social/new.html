{% extends "layout.html" %}
{% block content %}
<div class="max-w-xl mx-auto pb-10">
    <div class="glass p-8 rounded-3xl">
        <h1 class="text-2xl font-bold text-green-900 mb-6">Nouveau message</h1>
        {% if listing %}
        <p class="text-sm text-gray-600 mb-4">Au sujet de l'annonce : <a href="{{ url_for('exchange.exchange_detail', listing_id=listing.id) }}" class="underline font-bold">{{ listing.title }}</a> ({{ listing.owner }})</p>
        {% endif %}
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if listing %}
            <input type="hidden" name="annonce_id" value="{{ listing.id }}">
            <input type="hidden" name="vers" value="{{ listing.owner }}">
            <p class="text-sm">À : <b>{{ listing.owner }}</b></p>
            {% else %}
            <div>
                <label class="font-bold text-gray-700 text-sm">Destinataire (pseudo) *</label>
                <input type="text" name="vers" value="{{ vers }}" required class="w-full p-2 rounded bg-white/50 border border-white/30">
            </div>
            {% endif %}
            <div>
                <label class="font-bold text-gray-700 text-sm">Message *</label>
                <textarea name="message" rows="4" required maxlength="2000" placeholder="Bonjour, votre annonce m'intéresse…" class="w-full p-2 rounded bg-white/50 border border-white/30"></textarea>
            </div>
            <button class="w-full bg-green-700 text-white py-3 rounded-xl font-bold">Envoyer</button>
        </form>
    </div>
</div>
{% endblock %}
