{% extends "layout.html" %}
{% block content %}
<div class="max-w-xl mx-auto pb-10">
    <div class="glass p-8 rounded-3xl">
        <h1 class="text-3xl font-bold text-green-900 mb-2 text-center">Rejoindre Hinga</h1>
        <p class="text-center text-gray-600 mb-6 text-sm">Jardinage, entraide et partage. Sans adresse exacte, sans publicité.</p>

        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="username" placeholder="Pseudo *" required class="w-full p-2 rounded bg-white/50 border border-white/30">
                <input type="email" name="email" placeholder="Email *" required class="w-full p-2 rounded bg-white/50 border border-white/30">
            </div>
            <input type="password" name="password" placeholder="Mot de passe (8 caractères min.) *" required class="w-full p-2 rounded bg-white/50 border border-white/30">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="first_name" placeholder="Prénom" class="w-full p-2 rounded bg-white/50 border border-white/30">
                <input type="text" name="last_name" placeholder="Nom" class="w-full p-2 rounded bg-white/50 border border-white/30">
            </div>
            <input type="text" name="zone" placeholder="Ville / région (jamais d'adresse exacte)" class="w-full p-2 rounded bg-white/50 border border-white/30">
            <textarea name="presentation" rows="2" placeholder="Présentez-vous en quelques mots" class="w-full p-2 rounded bg-white/50 border border-white/30"></textarea>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="cherche" placeholder="Ce que je cherche (optionnel)" class="w-full p-2 rounded bg-white/50 border border-white/30">
                <input type="text" name="offre" placeholder="Ce que je peux offrir (optionnel)" class="w-full p-2 rounded bg-white/50 border border-white/30">
            </div>
            <label class="flex items-start gap-2 text-sm text-gray-700">
                <input type="checkbox" name="rules" class="w-5 h-5 mt-0.5">
                <span>J'ai lu et j'accepte la <a href="{{ url_for('auth.charte') }}" class="underline font-bold">charte de la communauté</a> *</span>
            </label>
            <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-xl font-bold">Envoyer ma demande</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">Déjà membre ? <a href="{{ url_for('auth.login') }}" class="underline font-bold">Se connecter</a></p>
    </div>
</div>
{% endblock %}
